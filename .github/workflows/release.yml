name: release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - releases/*

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'

  # Runs on the default branch immediately before `changeset publish`, so a tarball that
  # trips the gate blocks the release. It is a `needs:` of release, so it also runs on
  # pushes that only open or update the Version PR rather than publish — deliberate, it
  # fails closed.
  publish-gate:
    uses: cyberuni/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read

  # Secretless: no NPM_TOKEN, no CI_GITHUB_TOKEN. Publishing goes through npm trusted
  # publishing (OIDC) and the version PR through the built-in GITHUB_TOKEN, so the
  # permissions are declared here explicitly rather than inherited.
  release:
    uses: cyberuni/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: [code, publish-gate]
    permissions:
      id-token: write
      contents: write
      pull-requests: write

  docgen:
    uses: cyberuni/.github/.github/workflows/pnpm-docs.yml@v2
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    permissions:
      contents: write
    with:
      publish-dir: ./apps/page/storybook-static
